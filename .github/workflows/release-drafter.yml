name: "Release drafter"

# Maintains a draft release that accumulates merged pull requests. Nothing is
# ever published automatically: the draft waits until someone edits and
# publishes it deliberately.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    name: Update the draft release
    runs-on: ubuntu-latest
    permissions:
      # Scorecard flags any contents:write as a token-permission risk. It is
      # unavoidable here: creating and updating a draft release is the entire
      # purpose of this job. It is scoped to this job, the workflow runs only on
      # the default branch, and the draft is never published automatically.
      contents: write
      pull-requests: read    # read merged PR titles and labels
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
