name: "Pages"

# Publishes the README as a project page. Deploys only from the default branch;
# pull requests build the site to catch a broken config, but never publish.
on:
  push:
    branches: [ "main" ]
    paths: [ 'README.md', '_config.yml', '.github/workflows/pages.yml' ]
  pull_request:
    branches: [ "main" ]
    paths: [ 'README.md', '_config.yml', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: an interrupted
# deploy can leave the published site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Requires Pages to be enabled once with GitHub Actions as the source
      # (Settings > Pages > Source). This step fails with "Get Pages site
      # failed" until that is done, which is what a fork of this repository
      # will hit first.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    name: Deploy
    # Pull requests build only. Publishing from a PR would let any fork replace
    # the live site.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
