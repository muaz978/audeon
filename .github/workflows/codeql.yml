name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Every Monday at 03:23 UTC.
    - cron: '23 3 * * 1'
  workflow_dispatch:

# Deny by default at the top level, then grant only what each job needs. Without
# this, a job that forgets to declare permissions inherits the repository
# default rather than nothing, which is how a workflow quietly ends up with a
# writable token it never asked for.
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # macos-15 (Xcode 16) rather than macos-14 (Xcode 15, Swift 5.10): the older
    # image cannot build Swift 6 language mode, and its toolchain is two versions
    # behind a typical developer machine, so syntax that compiles locally can fail
    # here. The macOS floor is still enforced by Package.swift's .macOS(.v14)
    # deployment target, not by the runner's OS.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Swift app.
          - language: swift
            build: swift
          # The vendored C driver (Driver/vendor/BlackHole/BlackHole.c) plus the
          # Stage 0 test sources, built the way the project actually builds them.
          - language: c-cpp
            build: driver

    steps:
      # Actions are pinned to full commit SHAs: this job holds
      # security-events: write, and a mutable tag could be repointed at any time.
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Build Audeon
        if: matrix.build == 'swift'
        run: swift build

      - name: Build driver
        if: matrix.build == 'driver'
        # build-driver.sh compiles BlackHole.c with the Audeon branding header
        # force-included, which is exactly the configuration that ships. The
        # runner is macos-14, so clang and the CoreAudio SDK are already present.
        run: ./Driver/build-driver.sh

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  # CodeQL ships no shell language pack, so the install/packaging scripts -- the
  # ones that write into /Library/Audio/Plug-Ins/HAL as root -- would otherwise
  # get no static analysis at all. shellcheck is preinstalled on macOS runners.
  shellcheck:
    name: Analyze (shell)
    # Ubuntu, not macos-14: shellcheck ships on the Ubuntu runner image and is
    # absent from the macOS one, and linting these scripts needs no macOS
    # toolchain. Keeping it here also stops a lint failure from burning a
    # macOS runner minute.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run shellcheck
        run: |
          set -euo pipefail
          shellcheck Driver/*.sh scripts/*.sh

  # The Swift test suite. Kept separate from the CodeQL job so a failing test is
  # reported as a failing test rather than a failed analysis build.
  test:
    name: Test (swift)
    # macos-15 (Xcode 16) rather than macos-14 (Xcode 15, Swift 5.10): the older
    # image cannot build Swift 6 language mode, and its toolchain is two versions
    # behind a typical developer machine, so syntax that compiles locally can fail
    # here. The macOS floor is still enforced by Package.swift's .macOS(.v14)
    # deployment target, not by the runner's OS.
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Printed so a toolchain mismatch is diagnosable straight from the log:
      # the runner's Swift can be older than a local one, and syntax that
      # compiles on a developer machine may not compile here.
      - name: Show toolchain
        run: swift --version

      # The zero-warning claim was made in three pull requests before anything
      # checked it, and it was quietly false the whole time: it had only ever
      # been measured with `swift build`, which does not build the test target,
      # and the tests carried four warnings. An invariant nothing enforces is a
      # habit, not an invariant -- so it is a gate now, over both targets.
      #
      # Package.swift is on swift-tools-version 6.0, so this is the Swift 6
      # language mode: the concurrency diagnostics are errors here by default
      # rather than something a developer has to remember to opt into.
      - name: Build with warnings as errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test
